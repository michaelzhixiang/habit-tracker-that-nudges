<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#faf7f2" />
  <title>习惯追踪 / Habit Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #faf7f2;
      padding: 1.5rem;
      color: #2d2a26;
      -webkit-font-smoothing: antialiased;
      transition: transform 0.3s ease;
    }
    body.screen-shake { animation: screenShake 0.5s ease-in-out; }
    @keyframes screenShake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-6px) translateY(2px); }
      40% { transform: translateX(6px) translateY(-2px); }
      60% { transform: translateX(-4px) translateY(1px); }
      80% { transform: translateX(4px) translateY(-1px); }
    }
    .container { max-width: 520px; margin: 0 auto; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: #2d2a26;
      letter-spacing: -0.03em;
    }
    .subtitle { margin: 0.35rem 0 0 0; font-size: 0.875rem; color: #6b6560; font-weight: 400; }
    .lang-toggle {
      background: #fff;
      border: 1px solid #e8e4df;
      color: #6b6560;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8125rem;
      font-weight: 500;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }
    .lang-toggle:hover { background: #f5f2ed; color: #2d2a26; border-color: #d4cfc8; }
    .heatmap-section {
      background: #fff;
      border: 1px solid #e8e4df;
      padding: 1.5rem 1.5rem 1.75rem;
      margin-bottom: 1.5rem;
      border-radius: 6px;
    }
    .heatmap-title {
      font-size: 0.6875rem;
      font-weight: 600;
      color: #2d2a26;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 1rem;
    }
    .heatmap-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 6px;
      max-width: 100%;
    }
    .heatmap-weekday {
      text-align: center;
      font-size: 0.6875rem;
      font-weight: 600;
      color: #6b6560;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 1.4;
    }
    .heatmap-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      max-width: 100%;
    }
    .heatmap-cell {
      aspect-ratio: 1;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8125rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      transition: box-shadow 0.15s ease;
    }
    .heatmap-cell[data-count="0"] { background: #f5f2ed; color: #6b6560; }
    .heatmap-cell[data-count="1"] { background: #ebd5c8; color: #5c4a3d; }
    .heatmap-cell[data-count="2"] { background: #d4a574; color: #fff; }
    .heatmap-cell[data-count="3"] { background: #a96b48; color: #fff; }
    .heatmap-cell.empty { background: transparent; color: transparent; }
    .heatmap-cell[data-count="1"],
    .heatmap-cell[data-count="2"],
    .heatmap-cell[data-count="3"] { animation: heatmapFill 0.35s ease-out both; }
    @keyframes heatmapFill {
      from { transform: scale(0.85); opacity: 0.6; }
      to { transform: scale(1); opacity: 1; }
    }
    .heatmap-cell.today { box-shadow: inset 0 0 0 2px #c17f59; }
    .heatmap-cell:not(.empty):hover { box-shadow: 0 0 0 1px #2d2a26; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-top: 1.25rem;
    }
    .stat-card {
      background: linear-gradient(135deg, #fff 0%, #faf7f2 100%);
      border: 1px solid #e8e4df;
      border-radius: 6px;
      padding: 0.875rem 1rem;
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(45,42,38,0.08);
    }
    .stat-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: #c17f59;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
      margin-bottom: 0.25rem;
    }
    .stat-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #6b6560;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .stat-sublabel {
      font-size: 0.6875rem;
      color: #9c968f;
      margin-top: 0.25rem;
    }
    .stat-trend {
      display: inline-block;
      font-size: 0.75rem;
      margin-left: 0.25rem;
      font-weight: 600;
    }
    .stat-trend.up { color: #059669; }
    .stat-trend.down { color: #dc2626; }
    .stat-trend.neutral { color: #6b6560; }
    .card {
      background: #fff;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin-bottom: 0.75rem;
      box-shadow: 0 1px 2px rgba(45,42,38,0.06);
      border: 1px solid #e8e4df;
      transition: box-shadow 0.2s ease;
    }
    .card:hover { box-shadow: 0 4px 12px rgba(45,42,38,0.08); }
    .habit-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .habit-emoji { font-size: 1.1rem; line-height: 1; }
    .habit-row input[type="checkbox"] {
      width: 22px;
      height: 22px;
      cursor: pointer;
      flex-shrink: 0;
      accent-color: #c17f59;
      transition: transform 0.15s ease;
    }
    .habit-row input[type="checkbox"]:hover { transform: scale(1.08); }
    .habit-name { flex: 1; min-width: 0; font-size: 0.9375rem; font-weight: 500; color: #2d2a26; }
    .habit-name.done { text-decoration: line-through; color: #9c968f; }
    .btn {
      border: none;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      min-height: 36px;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-small { padding: 0.35rem 0.5rem; min-height: 32px; font-size: 0.75rem; }
    .btn-tired {
      background: #f5f2ed;
      color: #6b6560;
      border: 1px solid #e8e4df;
    }
    .btn-tired:hover {
      background: #ede9e3;
      color: #2d2a26;
      animation: wiggle 0.5s ease-in-out;
    }
    @keyframes wiggle {
      0%,100% { transform: rotate(0deg); }
      25% { transform: rotate(-2deg); }
      75% { transform: rotate(2deg); }
    }
    .btn-menu {
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: #94a3b8;
      border-radius: 8px;
      padding: 0;
      min-height: 32px;
    }
    .btn-menu:hover { background: #f1f5f9; color: #475569; }
    .btn-menu svg { width: 18px; height: 18px; }
    .menu-dropdown {
      position: absolute;
      right: 0;
      top: 100%;
      margin-top: 4px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      border: 1px solid rgba(0,0,0,0.06);
      padding: 4px;
      min-width: 120px;
      z-index: 10;
      animation: menuIn 0.15s ease;
    }
    @keyframes menuIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .menu-dropdown button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.5rem 0.75rem;
      border: none;
      background: none;
      border-radius: 6px;
      font-size: 0.8125rem;
      color: #475569;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .menu-dropdown button:hover { background: #f8fafc; color: #1e293b; }
    .menu-dropdown button.delete:hover { color: #dc2626; }
    .menu-wrap { position: relative; }
    .habit-name.inline-edit { display: none; }
    .habit-edit-input {
      width: 100%;
      max-width: 200px;
      padding: 0.35rem 0.5rem;
      border: 1px solid #c7d2fe;
      border-radius: 6px;
      font-size: 0.9375rem;
    }
    .habit-edit-input:focus { outline: none; border-color: #c17f59; box-shadow: 0 0 0 2px rgba(193,127,89,0.25); }
    .streak-row { margin-top: 0.5rem; font-size: 0.8125rem; color: #6b6560; }
    .streak-row strong { color: #059669; font-weight: 600; }
    .tip-box {
      margin-top: 0.75rem;
      padding: 0.875rem 1rem;
      background: #fff;
      border-radius: 8px;
      border: 1px solid #e8e4df;
      font-family: "Fredoka", "DM Sans", sans-serif;
      font-size: 1.1rem;
      line-height: 1.5;
      color: #2d2a26;
    }
    .tip-box .close-tip { margin-top: 0.5rem; font-family: "DM Sans", sans-serif; color: #c17f59; cursor: pointer; font-size: 0.8125rem; font-weight: 500; transition: opacity 0.15s; }
    .tip-box .close-tip:hover { opacity: 0.8; }
    .tip-box-error { background: #fef2f2; border-color: #fecaca; color: #b91c1c; font-family: "DM Sans", sans-serif; }
    .add-section {
      background: #fff;
      border-radius: 8px;
      padding: 1.25rem;
      margin-top: 1rem;
      box-shadow: 0 1px 2px rgba(45,42,38,0.06);
      border: 1px solid #e8e4df;
    }
    .add-section.hidden { display: none; }
    .add-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .add-row input {
      flex: 1;
      padding: 0.6rem 0.75rem;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.9375rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .add-row input:focus { outline: none; border-color: #c17f59; box-shadow: 0 0 0 2px rgba(193,127,89,0.25); }
    .btn-add { background: #c17f59; color: #fff; }
    .btn-add:hover { background: #a96b48; transform: translateY(-1px); }
    .install-banner {
      margin-top: 1.25rem;
      padding: 0.75rem 1rem;
      background: #f5f2ed;
      border-radius: 8px;
      border: 1px solid #e8e4df;
      color: #2d2a26;
      font-size: 0.8125rem;
    }
    .install-banner.hidden { display: none; }
    .install-banner button {
      margin-left: 0.5rem;
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #c17f59;
      color: #fff;
      font-weight: 500;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    .install-banner button:hover { background: #a96b48; transform: translateY(-1px); }
    .settings-icon {
      background: transparent;
      border: none;
      color: #6b6560;
      cursor: pointer;
      padding: 0.5rem;
      font-size: 1.25rem;
      line-height: 1;
      transition: color 0.2s ease, transform 0.15s ease;
    }
    .settings-icon:hover { color: #2d2a26; transform: rotate(30deg); }
    .settings-panel {
      position: fixed;
      top: 0;
      right: -100%;
      width: min(360px, 90vw);
      height: 100vh;
      background: #fff;
      box-shadow: -4px 0 20px rgba(0,0,0,0.12);
      z-index: 1000;
      transition: right 0.3s ease;
      overflow-y: auto;
      padding: 1.5rem;
    }
    .settings-panel.open { right: 0; }
    .settings-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.3);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .settings-overlay.open { opacity: 1; pointer-events: all; }
    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .settings-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #2d2a26;
      margin: 0;
    }
    .settings-close {
      background: transparent;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #6b6560;
      padding: 0.25rem;
      line-height: 1;
    }
    .settings-close:hover { color: #2d2a26; }
    .settings-section {
      margin-bottom: 1.75rem;
    }
    .settings-section-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: #2d2a26;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.75rem;
    }
    .settings-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0;
      border-bottom: 1px solid #f5f2ed;
    }
    .settings-item:last-child { border-bottom: none; }
    .settings-item-label {
      font-size: 0.9375rem;
      color: #2d2a26;
      font-weight: 500;
    }
    .settings-item-desc {
      font-size: 0.8125rem;
      color: #6b6560;
      margin-top: 0.25rem;
    }
    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #e8e4df;
      border-radius: 24px;
      transition: 0.3s;
    }
    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.3s;
    }
    .toggle-switch input:checked + .toggle-slider {
      background: #c17f59;
    }
    .toggle-switch input:checked + .toggle-slider:before {
      transform: translateX(20px);
    }
    .time-input {
      padding: 0.5rem 0.75rem;
      border: 1px solid #e8e4df;
      border-radius: 6px;
      font-size: 0.9375rem;
      color: #2d2a26;
      width: 120px;
    }
    .time-input:focus {
      outline: none;
      border-color: #c17f59;
      box-shadow: 0 0 0 2px rgba(193,127,89,0.25);
    }
    .notification-status {
      padding: 0.75rem 1rem;
      background: #f5f2ed;
      border-radius: 6px;
      font-size: 0.8125rem;
      color: #6b6560;
      margin-top: 0.5rem;
    }
    .notification-status.granted {
      background: #d1fae5;
      color: #065f46;
    }
    .notification-status.denied {
      background: #fee2e2;
      color: #991b1b;
    }
    .btn-insights {
      width: 100%;
      background: linear-gradient(135deg, #c17f59 0%, #a96b48 100%);
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: none;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 2px 8px rgba(193,127,89,0.3);
    }
    .btn-insights:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(193,127,89,0.4);
    }
    .btn-insights:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .insights-content {
      margin-top: 1rem;
      padding: 1rem;
      background: #faf7f2;
      border-radius: 8px;
      border: 1px solid #e8e4df;
      font-size: 0.9375rem;
      line-height: 1.6;
      color: #2d2a26;
      white-space: pre-wrap;
    }
    .insights-content.loading {
      text-align: center;
      color: #6b6560;
      font-style: italic;
    }
    .insights-content.error {
      background: #fee2e2;
      border-color: #fecaca;
      color: #991b1b;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=DM+Sans:wght@400;500;600&family=Fredoka:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1 id="title">习惯追踪</h1>
        <p class="subtitle" id="subtitle">每天三个小习惯，轻量坚持</p>
      </div>
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <button type="button" class="settings-icon" id="settingsBtn" aria-label="Settings" title="设置">⚙️</button>
        <button type="button" class="lang-toggle" id="langToggle" aria-label="Switch language">English</button>
      </div>
    </header>

    <section class="heatmap-section" id="heatmapSection">
      <div class="heatmap-title" id="heatmapTitle">本月</div>
      <div class="heatmap-weekdays" id="heatmapWeekdays"></div>
      <div class="heatmap-grid" id="heatmapGrid"></div>
      <div class="stats-grid" id="statsGrid"></div>
    </section>

    <main id="habitList"></main>

    <section class="add-section" id="addSection">
      <p id="addHint">最多添加 3 个习惯</p>
      <div class="add-row">
        <input type="text" id="habitInput" placeholder="" maxlength="50" />
        <button type="button" class="btn btn-add" id="addBtn"></button>
      </div>
    </section>

    <div class="install-banner hidden" id="installBanner">
      <span id="installText">添加到主屏幕，像 App 一样使用</span>
      <button type="button" id="installBtn">添加</button>
    </div>
  </div>

  <!-- Settings Panel -->
  <div class="settings-overlay" id="settingsOverlay"></div>
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-header">
      <h2 class="settings-title" id="settingsTitle">设置</h2>
      <button type="button" class="settings-close" id="settingsClose" aria-label="Close">×</button>
    </div>

    <div class="settings-section">
      <div class="settings-section-title" id="notificationSectionTitle">推送通知</div>

      <div class="settings-item">
        <div>
          <div class="settings-item-label" id="enableNotificationLabel">启用每日提醒</div>
          <div class="settings-item-desc" id="enableNotificationDesc">在设定时间收到习惯提醒</div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="notificationToggle">
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="settings-item" id="reminderTimeItem">
        <div>
          <div class="settings-item-label" id="reminderTimeLabel">提醒时间</div>
          <div class="settings-item-desc" id="reminderTimeDesc">每天提醒的时间</div>
        </div>
        <input type="time" class="time-input" id="reminderTime" value="09:00">
      </div>

      <div class="notification-status" id="notificationStatus"></div>
    </div>

    <div class="settings-section">
      <div class="settings-section-title" id="insightsSectionTitle">AI 洞察</div>
      <button type="button" class="btn-insights" id="getInsightsBtn">
        <span id="insightsBtnText">📊 查看习惯分析</span>
      </button>
      <div class="insights-content hidden" id="insightsContent"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'habit-tracker-data';
    const BACKUP_KEY = 'habit-tracker-data-backup';
    const LANG_KEY = 'habit-tracker-lang';
    var nudgeEmoji = '';

    function playDing() {
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 880; o.type = 'sine';
        g.gain.setValueAtTime(0.12, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
        o.start(ctx.currentTime); o.stop(ctx.currentTime + 0.15);
      } catch (e) {}
    }
    function playVictory() {
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine';
        o.frequency.setValueAtTime(523.25, ctx.currentTime);
        o.frequency.setValueAtTime(659.25, ctx.currentTime + 0.12);
        o.frequency.setValueAtTime(783.99, ctx.currentTime + 0.24);
        g.gain.setValueAtTime(0.15, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        o.start(ctx.currentTime); o.stop(ctx.currentTime + 0.4);
      } catch (e) {}
    }

    const i18n = {
      zh: {
        title: '习惯追踪',
        subtitle: '每天三个小习惯，轻量坚持',
        addHint: '最多添加 3 个习惯',
        addPlaceholder: '输入习惯名称',

    function getLang() {
      const saved = localStorage.getItem(LANG_KEY);
      if (saved === 'zh' || saved === 'en') return saved;
      return navigator.language && navigator.language.toLowerCase().startsWith('zh') ? 'zh' : 'en';
    }

    function setLang(lang) {
      localStorage.setItem(LANG_KEY, lang);
      renderLang();
      renderHabits();
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    }

    function t(key) {

    function loadHabits() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch {
        // If main data is corrupted, try to restore from backup
        try {
          const backup = localStorage.getItem(BACKUP_KEY);
          if (backup) {
            const data = JSON.parse(backup);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            return data;
          }
        } catch {}
        return [];
      }
    }

    function saveHabits(habits) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
      // Auto-backup after every save
      localStorage.setItem(BACKUP_KEY, JSON.stringify(habits));
    }

    function today() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function ensureCompletedDates(h) {
      const completed = h.completedDates && Array.isArray(h.completedDates) ? h.completedDates : [];
      const set = new Set(completed);
      const todayStr = today();
      if (h.done && h.date === todayStr && !set.has(todayStr)) set.add(todayStr);
      if (!h.done && set.has(todayStr)) set.delete(todayStr);
      return Array.from(set);
    }

    function getStreak(completedDates) {
      if (!completedDates || completedDates.length === 0) return 0;
      const sorted = [...completedDates].sort().reverse();
      const todayStr = today();
      if (sorted[0] !== todayStr) return 0;
      let streak = 1;
      for (let i = 1; i < sorted.length; i++) {
        const prev = new Date(sorted[i - 1]);
        const curr = new Date(sorted[i]);
        prev.setDate(prev.getDate() - 1);
        if (prev.toISOString().slice(0, 10) !== curr.toISOString().slice(0, 10)) break;
        streak++;
      }
      return streak;
    }

    function getCalendarDays(year, month) {
      const first = new Date(year, month, 1);
      const startDay = first.getDay();
      const last = new Date(year, month + 1, 0);
      const daysInMonth = last.getDate();
      const todayStr = today();
      const cells = [];
      for (let i = 0; i < startDay; i++) cells.push({ empty: true });
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        cells.push({ dateStr, d, empty: false, isToday: dateStr === todayStr });
      }
      return cells;
    }

    function getDayCounts(habits) {
      const counts = {};
      habits.forEach(h => {
        (h.completedDates || []).forEach(dateStr => {
          counts[dateStr] = (counts[dateStr] || 0) + 1;
        });
      });
      return counts;
    }

    function renderHeatmap(habits) {
      const grid = document.getElementById('heatmapGrid');
      const weekdaysEl = document.getElementById('heatmapWeekdays');
      if (!grid || !weekdaysEl) return;
      const lang = getLang();
      const weekdays = i18n[lang].weekdays || ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      weekdaysEl.innerHTML = '';
      weekdays.forEach(function (label) {
        const w = document.createElement('div');
        w.className = 'heatmap-weekday';
        w.textContent = label;
        weekdaysEl.appendChild(w);
      });
      const now = new Date();
      const calDays = getCalendarDays(now.getFullYear(), now.getMonth());
      const dayCounts = getDayCounts(habits);
      grid.innerHTML = '';
      calDays.forEach(function (cell) {
        const div = document.createElement('div');
        div.className = 'heatmap-cell';
        if (cell.empty) {
          div.setAttribute('data-count', '0');
          div.classList.add('empty');
          div.title = '';
        } else {
          const count = Math.min(3, dayCounts[cell.dateStr] || 0);
          div.setAttribute('data-count', String(count));
          div.textContent = cell.d;
          div.title = cell.dateStr + (count > 0 ? ' — ' + count + (lang === 'zh' ? ' 个习惯' : ' habits') : '');
          if (cell.isToday) div.classList.add('today');
        }
        grid.appendChild(div);
      });
      renderStats(habits);
    }

    function getLongestStreak(habits) {
      let maxStreak = 0;
      habits.forEach(h => {
        const completedDates = (h.completedDates || []).sort();
        if (completedDates.length === 0) return;
        let currentStreak = 1;
        for (let i = 1; i < completedDates.length; i++) {
          const prev = new Date(completedDates[i - 1]);
          const curr = new Date(completedDates[i]);
          prev.setDate(prev.getDate() + 1);
          if (prev.toISOString().slice(0, 10) === curr.toISOString().slice(0, 10)) {
            currentStreak++;
          } else {
            maxStreak = Math.max(maxStreak, currentStreak);
            currentStreak = 1;
          }
        }
        maxStreak = Math.max(maxStreak, currentStreak);
      });
      return maxStreak;
    }

    function getWeeklyCompletion(habits, weekOffset) {
      const now = new Date();
      const dayOfWeek = now.getDay();
      const startOfWeek = new Date(now);
      startOfWeek.setDate(now.getDate() - dayOfWeek + weekOffset * 7);
      const endOfWeek = new Date(startOfWeek);
      endOfWeek.setDate(startOfWeek.getDate() + 6);

      let completed = 0;
      let total = 0;
      for (let d = 0; d < 7; d++) {
        const checkDate = new Date(startOfWeek);
        checkDate.setDate(startOfWeek.getDate() + d);
        const dateStr = checkDate.toISOString().slice(0, 10);
        if (checkDate <= now) {
          habits.forEach(h => {
            total++;
            if ((h.completedDates || []).includes(dateStr)) {
              completed++;
            }
          });
        }
      }
      return { completed, total };
    }

    function getMonthlyCompletionRate(habits) {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const today = now.getDate();

      let completed = 0;
      let total = 0;

      for (let d = 1; d <= today && d <= daysInMonth; d++) {
        const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        habits.forEach(h => {
          total++;
          if ((h.completedDates || []).includes(dateStr)) {
            completed++;
          }
        });
      }

      return total > 0 ? Math.round((completed / total) * 100) : 0;
    }

    function renderStats(habits) {
      const statsGrid = document.getElementById('statsGrid');
      if (!statsGrid || habits.length === 0) {
        if (statsGrid) statsGrid.innerHTML = '';
        return;
      }

      const lang = getLang();
      const monthlyRate = getMonthlyCompletionRate(habits);
      const longestStreak = getLongestStreak(habits);
      const thisWeek = getWeeklyCompletion(habits, 0);
      const lastWeek = getWeeklyCompletion(habits, -1);

      const thisWeekRate = thisWeek.total > 0 ? Math.round((thisWeek.completed / thisWeek.total) * 100) : 0;
      const lastWeekRate = lastWeek.total > 0 ? Math.round((lastWeek.completed / lastWeek.total) * 100) : 0;
      const weekTrend = thisWeekRate > lastWeekRate ? 'up' : thisWeekRate < lastWeekRate ? 'down' : 'neutral';
      const weekTrendSymbol = thisWeekRate > lastWeekRate ? '↑' : thisWeekRate < lastWeekRate ? '↓' : '→';

      statsGrid.innerHTML =
        '<div class="stat-card">' +
        '<div class="stat-value">' + monthlyRate + '%</div>' +
        '<div class="stat-label">' + t('statMonthlyRate') + '</div>' +
        '</div>' +
        '<div class="stat-card">' +
        '<div class="stat-value">' + longestStreak + '</div>' +
        '<div class="stat-label">' + t('statLongestStreak') + '</div>' +
        '<div class="stat-sublabel">' + t('statDays') + '</div>' +
        '</div>' +
        '<div class="stat-card">' +
        '<div class="stat-value">' +
        thisWeek.completed + '<span style="font-size: 1rem; color: #6b6560;">/' + thisWeek.total + '</span>' +
        '</div>' +
        '<div class="stat-label">' + t('statThisWeek') + '</div>' +
        '<div class="stat-sublabel">' + t('statCompleted') + '</div>' +
        '</div>' +
        '<div class="stat-card">' +
        '<div class="stat-value">' +
        thisWeekRate + '%' +
        '<span class="stat-trend ' + weekTrend + '">' + weekTrendSymbol + '</span>' +
        '</div>' +
        '<div class="stat-label">' + (lang === 'zh' ? '周对比' : 'vs Last Week') + '</div>' +
        '<div class="stat-sublabel">' + t('statLastWeek') + ': ' + lastWeekRate + '%</div>' +
        '</div>';
    }

      const wrap = document.getElementById('tip-' + habitId);
      if (!wrap) return;
      const existing = wrap.querySelector('.tip-box');
      if (existing) existing.remove();
      const box = document.createElement('div');
      box.className = 'tip-box';
      box.innerHTML = '<span>' + t('tipLoading') + '</span>';
      wrap.appendChild(box);
    }

    function showTipContent(habitId, text, isError) {
      const wrap = document.getElementById('tip-' + habitId);
      if (!wrap) return;
      const existing = wrap.querySelector('.tip-box');
      if (existing) existing.remove();
      const box = document.createElement('div');
      box.className = 'tip-box' + (isError ? ' tip-box-error' : '');
      box.innerHTML = '<span>' + escapeHtml(text) + '</span><div class="close-tip">' + t('gotIt') + '</div>';
      box.querySelector('.close-tip').onclick = function () { box.remove(); };
      wrap.appendChild(box);
    }

    async function fetchEmojis(habits, includeNudge) {
      if (!habits || habits.length === 0 && !includeNudge) return;
      try {
        const res = await fetch('/api/emoji', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ names: habits.map(function (h) { return h.name; }), nudge: !!includeNudge, lang: getLang() }),
        });
        if (!res.ok) return;
        const data = await res.json();
        if (data.emojis && data.emojis.length) {
          habits.forEach(function (h, i) { h.emoji = data.emojis[i] || h.emoji || '✨'; });
          saveHabits(habits);
        }
        if (includeNudge && data.nudgeEmoji) nudgeEmoji = data.nudgeEmoji;
      } catch (e) {}
    }

    async function fetchAISuggestion(habitName) {
      const lang = getLang();
      try {
        const res = await fetch('/api/suggest', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ habitName, lang }),
        });
        if (!res.ok) throw new Error('API error');
        const data = await res.json();
        return data.suggestion || data.text || '';
      } catch (e) {
        return null;
      }
    }

    async function showTip(habitId, habitName) {
      const wrap = document.getElementById('tip-' + habitId);
      if (!wrap) return;
      showTipLoading(habitId);
      const suggestion = await fetchAISuggestion(habitName);
      if (suggestion) showTipContent(habitId, suggestion, false);
      else showTipContent(habitId, t('tipError'), true);
    }

    function closeMenus() {
      document.querySelectorAll('.menu-dropdown').forEach(el => el.remove());
    }

    function renderHabits() {
      let habits = loadHabits();
      const todayStr = today();
      habits = habits.map(h => {
        const done = h.date === todayStr ? h.done : false;
        const completedDates = ensureCompletedDates({ ...h, done, date: todayStr });
        return { ...h, done, date: todayStr, completedDates };
      });
      saveHabits(habits);

      renderHeatmap(habits);

      const list = document.getElementById('habitList');
      list.innerHTML = '';

      habits.forEach((h, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        const tipWrap = document.createElement('div');
        tipWrap.id = 'tip-' + h.id;
        const streakCount = getStreak(h.completedDates || []);
        const emoji = h.emoji || '·';

        const nudgeLabel = t('cant') + (nudgeEmoji ? ' ' + nudgeEmoji : '');
        card.innerHTML =
          '<div class="habit-row">' +
          '<input type="checkbox" id="cb-' + h.id + '" ' + (h.done ? 'checked' : '') + ' />' +
          '<span class="habit-emoji" aria-hidden="true">' + emoji + '</span>' +
          '<span class="habit-name' + (h.done ? ' done' : '') + '" id="name-' + h.id + '">' + escapeHtml(h.name) + '</span>' +
          '<button type="button" class="btn btn-tired btn-small" data-id="' + h.id + '">' + nudgeLabel + '</button>' +
          '<div class="menu-wrap">' +
          '<button type="button" class="btn btn-menu" aria-label="Menu">' +
          '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="6" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="18" r="1.5"/></svg>' +
          '</button>' +
          '</div></div>' +
          '<div class="streak-row">' + (getLang() === 'zh' ? t('streak') + ' <strong>' + streakCount + '</strong> 天' : t('streak') + ': <strong>' + streakCount + '</strong>' + (streakCount === 1 ? ' day' : ' days')) + '</div>';
        card.appendChild(tipWrap);

        const cb = card.querySelector('input[type="checkbox"]');
        const nameEl = card.querySelector('.habit-name');
        cb.onchange = function () {
          const idx = habits.findIndex(x => x.id === h.id);
          if (idx === -1) return;
          const wasDone = habits[idx].done;
          habits[idx].done = cb.checked;
          habits[idx].date = todayStr;
          const completed = new Set(habits[idx].completedDates || []);
          if (cb.checked) completed.add(todayStr); else completed.delete(todayStr);
          habits[idx].completedDates = Array.from(completed);
          saveHabits(habits);
          nameEl.classList.toggle('done', cb.checked);
          if (cb.checked && !wasDone) {
            playDing();
            if (typeof confetti === 'function') confetti({ particleCount: 60, spread: 55, origin: { y: 0.7 } });
            var doneCount = habits.filter(function (x) { return x.done; }).length;
            if (doneCount === 3) {
              document.body.classList.add('screen-shake');
              playVictory();
              if (typeof confetti === 'function') {
                confetti({ particleCount: 120, spread: 100, origin: { y: 0.5 } });
                setTimeout(function () { confetti({ particleCount: 80, angle: 60, spread: 55, origin: { x: 0 } }); }, 150);
                setTimeout(function () { confetti({ particleCount: 80, angle: 120, spread: 55, origin: { x: 1 } }); }, 250);
              }
              setTimeout(function () { document.body.classList.remove('screen-shake'); }, 500);
            }
          }
          renderHabits();
        };

        card.querySelector('.btn-tired').onclick = function () { closeMenus(); showTip(h.id, h.name); };

        const menuWrap = card.querySelector('.menu-wrap');
        const menuBtn = card.querySelector('.btn-menu');
        menuBtn.onclick = function (e) {
          e.stopPropagation();
          closeMenus();
          const open = document.createElement('div');
          open.className = 'menu-dropdown';
          open.innerHTML = '<button type="button" class="menu-edit" data-i18n="edit">' + t('edit') + '</button><button type="button" class="delete">' + t('delete') + '</button>';
          menuWrap.appendChild(open);
          open.onclick = function (e) { e.stopPropagation(); };
          open.querySelector('.menu-edit').onclick = function () { open.remove(); startEdit(h.id, h.name); };
          open.querySelector('.delete').onclick = function () { open.remove(); deleteHabit(h.id); };
          setTimeout(function () {
            document.addEventListener('click', function onOut() {
              document.removeEventListener('click', onOut);
              if (open.parentNode) open.remove();
            });
          }, 0);
        };

        list.appendChild(card);
      });

      const addSection = document.getElementById('addSection');
      addSection.classList.toggle('hidden', habits.length >= 3);
    }

    function startEdit(habitId, currentName) {
      const nameEl = document.getElementById('name-' + habitId);
      if (!nameEl) return;
      const row = nameEl.closest('.habit-row');
      let input = row.querySelector('.habit-edit-input');
      if (input) return;
      nameEl.classList.add('inline-edit');
      input = document.createElement('input');
      input.type = 'text';
      input.className = 'habit-edit-input';
      input.value = currentName;
      input.maxLength = 50;
      row.insertBefore(input, nameEl.nextSibling);
      input.focus();
      input.select();
      function saveEdit() {
        const name = (input.value || '').trim();
        if (name) {
          const habits = loadHabits();
          const idx = habits.findIndex(x => x.id === habitId);
          if (idx !== -1) { habits[idx].name = name; saveHabits(habits); renderHabits(); }
        } else {
          nameEl.classList.remove('inline-edit');
          input.remove();
        }
      }
      input.onblur = saveEdit;
      input.onkeydown = function (e) {
        if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
        if (e.key === 'Escape') { input.value = currentName; input.blur(); }
      };
    }

    function deleteHabit(habitId) {
      if (!confirm(getLang() === 'zh' ? '确定删除这个习惯？' : 'Delete this habit?')) return;
      let habits = loadHabits().filter(x => x.id !== habitId);
      saveHabits(habits);
      renderHabits();
    }

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    function addHabit() {
      const habits = loadHabits();
      if (habits.length >= 3) return;
      const input = document.getElementById('habitInput');
      const name = (input.value || '').trim();
      if (!name) return;
      habits.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2),
        name,
        done: false,
        date: today(),
      });
      saveHabits(habits);
      input.value = '';
      renderHabits();
      renderLang();
      fetchEmojis(loadHabits(), false).then(function () { renderHabits(); });
    }

    document.getElementById('habitInput').onkeydown = function (e) {
      if (e.key === 'Enter') addHabit();
    };
    document.getElementById('addBtn').onclick = addHabit;
    document.getElementById('langToggle').onclick = function () {
      setLang(getLang() === 'zh' ? 'en' : 'zh');
    };

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBanner').classList.remove('hidden');
    });
    document.getElementById('installBtn').onclick = function () {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function () { deferredPrompt = null; });
      document.getElementById('installBanner').classList.add('hidden');
    };
    window.addEventListener('appinstalled', function () {
      document.getElementById('installBanner').classList.add('hidden');
    });

    setLang(getLang());
    renderHabits();
    fetchEmojis(loadHabits(), true).then(function () { renderHabits(); });

    // --- Daily auto-refresh ---
    let lastRenderedDate = today();

    // Schedule a refresh at midnight
    function scheduleMidnightRefresh() {
      const now = new Date();
      const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
      const msUntilMidnight = tomorrow - now + 500; // +500ms buffer
      setTimeout(function () {
        lastRenderedDate = today();
        renderHabits();
        scheduleMidnightRefresh(); // schedule the next one
      }, msUntilMidnight);
    }
    scheduleMidnightRefresh();

    // Also refresh when the user returns to the tab on a new day
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && today() !== lastRenderedDate) {
        lastRenderedDate = today();
        renderHabits();
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }

    // ==================== Notification Settings ====================
    const NOTIFICATION_SETTINGS_KEY = 'habit-tracker-notification-settings';

    function getNotificationSettings() {
      try {
        const raw = localStorage.getItem(NOTIFICATION_SETTINGS_KEY);
        return raw ? JSON.parse(raw) : { enabled: false, time: '09:00' };
      } catch {
        return { enabled: false, time: '09:00' };
      }
    }

    function saveNotificationSettings(settings) {
      localStorage.setItem(NOTIFICATION_SETTINGS_KEY, JSON.stringify(settings));
    }

    function updateNotificationStatus() {
      const statusEl = document.getElementById('notificationStatus');
      if (!statusEl) return;
      const lang = getLang();
      if (!('Notification' in window)) {
        statusEl.textContent = i18n[lang].notificationBlocked;
        statusEl.className = 'notification-status denied';
        return;
      }
      const permission = Notification.permission;
      if (permission === 'granted') {
        statusEl.textContent = i18n[lang].notificationGranted;
        statusEl.className = 'notification-status granted';
      } else if (permission === 'denied') {
        statusEl.textContent = i18n[lang].notificationDenied;
        statusEl.className = 'notification-status denied';
      } else {
        statusEl.textContent = i18n[lang].notificationDefault;
        statusEl.className = 'notification-status';
      }
    }

    async function requestNotificationPermission() {
      if (!('Notification' in window)) return false;
      if (Notification.permission === 'granted') return true;
      if (Notification.permission === 'denied') return false;
      const permission = await Notification.requestPermission();
      updateNotificationStatus();
      return permission === 'granted';
    }

    function sendNotification(title, body) {
      if (!('Notification' in window)) return;
      if (Notification.permission !== 'granted') return;
      try {
        new Notification(title, {
          body: body,
          icon: 'icon.svg',
          badge: 'icon.svg',
          tag: 'habit-reminder',
          renotify: true,
        });
      } catch (e) {
        console.error('Failed to send notification:', e);
      }
    }

    function checkAndSendReminder() {
      const settings = getNotificationSettings();
      if (!settings.enabled) return;
      if (Notification.permission !== 'granted') return;

      const now = new Date();
      const currentTime = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      const reminderTime = settings.time || '09:00';

      // Check if it's the reminder time (with 1 minute tolerance)
      if (currentTime === reminderTime) {
        const habits = loadHabits();
        const incompleteTasks = habits.filter(h => !h.done).length;
        if (incompleteTasks > 0) {
          const lang = getLang();
          const title = i18n[lang].notificationTitle;
          const body = i18n[lang].notificationBody;
          sendNotification(title, body);
        }
      }
    }

    // Check for reminders every minute
    setInterval(checkAndSendReminder, 60000);

    // Settings panel controls
    document.getElementById('settingsBtn').onclick = function () {
      document.getElementById('settingsPanel').classList.add('open');
      document.getElementById('settingsOverlay').classList.add('open');
      // Load current settings
      const settings = getNotificationSettings();
      document.getElementById('notificationToggle').checked = settings.enabled;
      document.getElementById('reminderTime').value = settings.time;
      updateNotificationStatus();
    };

    function closeSettingsPanel() {
      document.getElementById('settingsPanel').classList.remove('open');
      document.getElementById('settingsOverlay').classList.remove('open');
    }

    document.getElementById('settingsClose').onclick = closeSettingsPanel;
    document.getElementById('settingsOverlay').onclick = closeSettingsPanel;

    document.getElementById('notificationToggle').onchange = async function () {
      const enabled = this.checked;
      if (enabled) {
        const granted = await requestNotificationPermission();
        if (!granted) {
          this.checked = false;
          return;
        }
      }
      const settings = getNotificationSettings();
      settings.enabled = enabled;
      saveNotificationSettings(settings);
      updateNotificationStatus();
    };

    document.getElementById('reminderTime').onchange = function () {
      const settings = getNotificationSettings();
      settings.time = this.value;
      saveNotificationSettings(settings);
    };

    // ==================== AI Insights ====================
    async function fetchInsights() {
      const lang = getLang();
      const habits = loadHabits();

      // Check if there's enough data
      const hasData = habits.some(h => (h.completedDates || []).length > 0);
      if (!hasData) {
        return { error: false, insights: i18n[lang].insightsEmpty };
      }

      try {
        const res = await fetch('/api/insights', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ habits, lang }),
        });
        if (!res.ok) throw new Error('API error');
        const data = await res.json();
        return { error: false, insights: data.insights || '' };
      } catch (e) {
        return { error: true, insights: i18n[lang].insightsError };
      }
    }

    document.getElementById('getInsightsBtn').onclick = async function () {
      const btn = this;
      const btnText = document.getElementById('insightsBtnText');
      const content = document.getElementById('insightsContent');
      const lang = getLang();

      // Disable button and show loading
      btn.disabled = true;
      btnText.textContent = i18n[lang].insightsBtnLoading;
      content.className = 'insights-content loading';
      content.classList.remove('hidden');
      content.textContent = i18n[lang].insightsBtnLoading;

      // Fetch insights
      const result = await fetchInsights();

      // Display results
      content.className = 'insights-content' + (result.error ? ' error' : '');
      content.textContent = result.insights;

      // Re-enable button
      btn.disabled = false;
      btnText.textContent = i18n[lang].insightsBtnText;
    };
  </script>
</body>
</html>
